[metadata]
name = manimate
description = An Interactive Animation Builder for Manim
author = Kevin Cen
author_email = hi@kevcen.com
license = MIT License
license_file = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.10
version = 1.0.0

[options]
python_requires = >=3.10
install_requires =
    bidict
    manim==0.19.0
    moderngl==5.12.0
    moderngl-window==3.1.1
    PySide6==6.6.0
    ipython==8.0.1
package_dir =
    =src  
packages = find:
include_package_data = True
zip_safe = False

[options.packages.find]
where=src

[options.package_data]
view = styles.qss

[options.entry_points]
console_scripts = 
    manimate = src.main:main